repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: bash -c 'cd backend && uv run ruff check --fix .'
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: ruff-format
        name: ruff format
        language: system
        entry: bash -c 'cd backend && uv run ruff format .'
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: frontend-lint
        name: Frontend lint (Prettier)
        language: system
        entry: bash -c 'cd frontend && bun run format && bun run lint'
        pass_filenames: false
        files: ^frontend/

      - id: backend-test
        name: Backend tests (pytest)
        language: system
        entry: bash -c 'cd backend && uv run pytest'
        pass_filenames: false
        files: ^backend/

      - id: frontend-build
        name: Frontend build
        language: system
        entry: bash -c 'cd frontend && bun run build'
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]

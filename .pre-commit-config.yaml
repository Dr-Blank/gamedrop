repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: bash -c 'cd backend && uv run ruff check --fix . && (git diff --exit-code -- . || (echo "ruff fixed files. Stage them and commit again." && exit 1)) && uv run ruff check .'
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: ruff-format
        name: ruff format
        language: system
        entry: bash -c 'cd backend && uv run ruff format . && (git diff --exit-code -- . || (echo "ruff formatted files. Stage them and commit again." && exit 1)) && uv run ruff format --check .'
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: frontend-lint
        name: Frontend lint (Prettier)
        language: system
        entry: bash -c 'cd frontend && bun run format && (git diff --exit-code -- . || (echo "Prettier reformatted files. Stage them and commit again." && exit 1)) && bun run lint'
        pass_filenames: false
        files: ^frontend/

      - id: backend-test
        name: Backend tests (pytest)
        language: system
        entry: bash -c 'cd backend && uv run pytest'
        pass_filenames: false
        files: ^backend/

      - id: frontend-build
        name: Frontend build
        language: system
        entry: bash -c 'cd frontend && bun run build'
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]

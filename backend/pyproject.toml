[project]
name = "gamedrop"
version = "0.1.0"
description = "Self-hostable price tracker for board game buyers"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "python-ntfy>=0.11.2",
    "rapidfuzz>=3.14.5",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.49.0",
    "xmltodict>=1.0.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long — formatter handles wrapping
    "B008",   # Depends() in function defaults is the FastAPI DI pattern
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
